[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weave"
dynamic = ["version"]
description = "One thing, done properly: a single LLM interaction. One input (messages + optional tools), one output (normalized LLMResponse). Vendor-agnostic (OpenAI-compatible / Anthropic native), zero third-party dependencies, offline-testable."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Weave Contributors"}
]
keywords = [
    "llm",
    "openai",
    "anthropic",
    "deepseek",
    "provider",
    "streaming",
    "sse",
    "retry",
    "tool-calls",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 核心零第三方依赖：HTTP 用 stdlib（urllib），SSE 自己解析。
dependencies = []

[project.optional-dependencies]
# 只用于跑测试 / CI；运行 weave 本身不需要任何第三方包。
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Asher0501/Weave"
Repository = "https://github.com/Asher0501/Weave"
Issues = "https://github.com/Asher0501/Weave/issues"

[tool.setuptools.dynamic]
version = {attr = "weave.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["weave*"]

[tool.setuptools.package-data]
weave = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/v04"]
addopts = "-q"
