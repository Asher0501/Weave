# Weave 完整配置参考。
# 这里是「所有可选项」的权威清单。默认 weave.yaml 只含必填项；
# 本文件中的每一项都有默认值，不写也能跑，写它只为按需微调。

agent:
  name: default                  # Agent 名称（REST 路由 /agents/{name}/... 用到）

llm:
  provider: anthropic            # anthropic | openai | deepseek
  model: ${WEAVE_MODEL:-claude-sonnet-5-20251001}
  max_tokens: ${WEAVE_MAX_TOKENS:-4096}
  temperature: ${WEAVE_TEMP:-0.7}
  # api_key 绝不在此硬编码，从环境变量 ANTHROPIC_API_KEY / OPENAI_API_KEY /
  # DEEPSEEK_API_KEY 读取
  base_url: ""                   # 自定义 API 地址；deepseek 默认 https://api.deepseek.com/v1

loop:
  type: iterative                # simple | iterative | scheduled（默认 iterative）
  max_iterations: ${WEAVE_MAX_ITER:-10}
  stop_conditions:
    - type: no_tool_calls        # 语义停止（可选）：no_tool_calls / tool_call:{name} / text_pattern
  timeout: 5.0                   # stream() 后台任务收尾宽限时长（秒）
  # stream_timeout: 120.0        # 可选：stream()/WS 空闲超时兜底（秒）；默认不启用。
                                 # 以"自上次事件的时间"计时：每次等待事件都以 stream_timeout
                                 # 为上限、事件到达即重置。仅当长时间无任何事件（LLM 调用
                                 # 挂起）时取消在途调用并 emit error。非流式 LLM 调用
                                 # （含 tools）在途时视为活动、不触发。
                                 # 注意与 timeout 区分：timeout 是收到 done/error 后的宽限时长，
                                 # stream_timeout 是空闲超时，不是"整次运行总时长上限"。
  tool_timeout: 30.0             # 单个 tool 执行超时（秒）
  llm_timeout: 120.0             # "在途"非流式 LLM 调用被视为"活动"的最长时长（秒）
  llm_call_timeout: 120.0        # 单次非流式 LLM 调用的硬超时（含重试序列，秒）
  llm_retry_attempts: 3          # 非流式 LLM 调用重试次数（1=不重试）
  llm_retry_backoff: 2.0         # 重试退避倍率
  memory_context_limit: 20       # before_think 注入 system prompt 的 stream 历史条数上限
  memory_knowledge_topk: 5       # before_think 知识检索注入条数上限（knowledge search 的 top_k）
  messages_window: 20            # iterative LLM 消息窗口条数上限（超过则裁剪最旧对话；最小值 3）
  event_min_interval: 1.0        # 事件驱动 scheduled 最小触发间隔（秒）

memory:
  # 三种访问模式：stream（对话历史）/ state（键值状态）/ knowledge（知识库，关键词搜索；chroma 后端为语义向量搜索）。
  # 作用域（scope）由项目自定义，隔离键 namespace 格式 {scope_name}:{scope_id}:{access_type}。
  # scope_id 来自运行时 scope_hints（key 约定 {scope_name}_id）。
  # 不写 memory: 段时，自动用默认 scope + SQLite + ./data/memory.db。
  default_backend: sqlite        # sqlite | file | chroma（chroma 仅 knowledge 可用）
  default_path: ./data/memory.db
  scopes:
    session:
      priority: 0                # 越小越"窄"，多 scope 时窄覆盖宽（可选）
      stream:
        backend: sqlite
        path: ${WEAVE_DATA_DIR:-./data}/memory.db
        ttl: 3600                # 过期时间（秒）；不写 = 永不过期
      state:
        backend: sqlite
        path: ${WEAVE_DATA_DIR:-./data}/memory.db
      knowledge:
        backend: sqlite
        path: ${WEAVE_DATA_DIR:-./data}/memory.db

prompts:
  system: prompts/system.md      # 未配置时用内置默认 prompt
  loop_instruction: prompts/loop.md
  memory_use: prompts/memory.md
  # 路径解析规则：
  #   prompts/system.md      → 相对配置目录的 prompts/system.md
  #   system（裸名）          → registry 命名 prompt，同为 prompts/system.md
  #   ./system.md 或绝对路径  → 按文件直载（相对配置目录 / 绝对路径）

features:
  schema_validation: false
  structured_call: false
  two_stage_pipeline: false
  prompt_defense: false

server:
  host: 127.0.0.1
  port: 48080
  cors_origins: []

logging:
  level: INFO
  # file: ./logs/weave.log        # 可选，不配置时输出到 stderr

checkpoint:                       # 状态回滚（docs/issues/012）
  enabled: false                  # 是否启用自动打点；默认关闭（零开销，向后兼容）
  trigger: after_each_tool        # after_each_tool | after_each_llm | manual
  keep: 10                        # 每 session 保留最近 N 个快照（fork 语义，淘汰最旧）

observability:                    # 可观测性（weave.last_trace + 落盘）
  enabled: false                  # 是否采集本次 run 的完整链路；默认关闭（零开销）
  # path: ./data/traces.jsonl     # 可选：落盘 JSONL（每 run 一行）；不写 = 仅内存 last_trace
